<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alke Wallet - Transferir</title>
  <!-- Bootstrap 4 básico -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-primary navbar-expand">
    <span class="navbar-brand font-weight-bold">Alke Wallet</span>
    <div class="navbar-nav ml-auto">
      <a class="nav-item nav-link" href="menu.html">Inicio</a>
    </div>
  </nav>

  <!-- Tarjeta de Transferencia -->
  <div class="container my-5" style="max-width: 400px;">
    <div class="card p-4 shadow-sm" id="tarjeta-transferir">
      <h1 class="h4 text-muted text-center mb-3">Transferir Dinero</h1>

      <!-- Contenedor dinámico para Alertas de Bootstrap (AGREGADO) -->
      <div id="alert-container"></div>

      <!-- Saldo actual disponible -->
      <div class="my-3 text-left">
        <p class="text-secondary mb-1">Saldo disponible:</p>
        <h3 id="saldo-actual" class="text-success font-weight-bold">$0</h3>
      </div>

      <!-- Formulario para Transferir (MODIFICADO) -->
      <form id="sendMoneyForm">
        <div class="form-group text-left">
          <label for="buscar-contacto" class="text-secondary font-weight-bold">Buscar Contacto:</label>
          <input type="text" class="form-control" id="buscar-contacto" placeholder="Escribe un nombre..." list="contactos-sugeridos" required>
          
          <datalist id="contactos-sugeridos">
            <option value="Juan Pérez">
            <option value="María López">
            <option value="Carlos Gómez">
          </datalist>
        </div>

        <div class="form-group text-left">
          <label for="monto-transferir" class="text-secondary font-weight-bold">Monto a transferir ($):</label>
          <input type="number" class="form-control" id="monto-transferir" placeholder="Ej: 5000" min="1" required>
        </div>

        <button type="submit" id="btn-transferir" class="btn btn-primary btn-block mb-3">Realizar Transferencia</button>
      </form>

      <hr>

      <!-- Botón para mostrar/ocultar el formulario de nuevo contacto (AGREGADO) -->
      <button id="btn-toggle-contacto" class="btn btn-outline-info btn-sm btn-block mb-3">
        + Desplegar opción: Agregar nuevo contacto
      </button>

      <!-- Formulario oculto de Agregar Nuevo Contacto (MODIFICADO) -->
      <form id="form-nuevo-contacto" class="text-left p-3 border rounded bg-white" style="display: none;">
        <h6 class="text-muted font-weight-bold mb-3">Nuevo Destinatario</h6>
        
        <div class="form-group mb-2">
          <input type="text" class="form-control form-control-sm" id="nuevo-contacto-nombre" placeholder="Nombre completo" required>
        </div>
        <div class="form-group mb-2">
          <input type="text" class="form-control form-control-sm" id="nuevo-contacto-cbu" placeholder="CBU / Alias (ej: 22 dígitos)" maxlength="22">
        </div>

        <button type="submit" id="btn-agregar-contacto" class="btn btn-success btn-sm btn-block mt-2">Guardar Contacto</button>
      </form>

      <a href="menu.html" class="btn btn-outline-secondary btn-block mt-3">Volver al Menú</a>
    </div>
  </div>

  <!-- jQuery y el Script -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="js/sendmoney.js"></script>
</body>
</html>
